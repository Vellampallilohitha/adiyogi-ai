workflows:
  android-release:
    name: Android AAB (Capacitor)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        NODE_VERSION: "20"
      android_signing:
        - keystore_reference
    scripts:
      - name: Use Node $NODE_VERSION
        script: |
          nvm install $NODE_VERSION
          nvm use $NODE_VERSION
      - name: Install deps
        script: |
          cd frontend
          npm ci
      - name: Build web
        script: |
          cd frontend
          npm run build
      - name: Sync Capacitor
        script: |
          cd frontend
          npx cap sync android
      - name: Build Android AAB
        script: |
          cd frontend/android
          ./gradlew bundleRelease
    artifacts:
      - frontend/android/app/build/outputs/bundle/release/*.aab
